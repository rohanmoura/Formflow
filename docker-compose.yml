name: formflow
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: formflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-formflow}
      POSTGRES_DB: formflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formflow -d formflow"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    image: ${FORMFLOW_IMAGE:-formflow:local}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://formflow:${POSTGRES_PASSWORD:-formflow}@postgres:5432/formflow?schema=public
      APP_URL: ${APP_URL:-http://localhost:3000}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    command: ["sh", "-c", "pnpm --filter @formflow/db exec prisma migrate deploy && pnpm --filter @formflow/web start"]
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
  caddy:
    image: caddy:2-alpine
    profiles: [tls]
    restart: unless-stopped
    environment:
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
